    h1: Residential Interior Design in Delhi NCR
    intro: Arqvexa designs homes that work for real life — light, storage, circulation and finishes planned before anything is built. We serve Delhi, Noida, Gurgaon and nearby areas with site visits, 2D layouts, 3D visualization and execution coordination.
    cta_label: Book an Interior Design Consultation
    sections:
      - heading: What we design for homes
        body: |
          <p>From compact <strong>2BHK apartments in Noida</strong> to larger <strong>3BHK homes in Gurgaon</strong>, we plan living rooms, bedrooms, kitchens, bathrooms and entry zones as one coherent story.</p>
          <ul>
            <li>Space planning and furniture layout</li>
            <li>Storage, wardrobes and TV units</li>
            <li>Material and colour palettes</li>
            <li>Lighting layers and electrical planning guidance</li>
            <li>Modular kitchen and wardrobe integration</li>
          </ul>
      - heading: Typical project scope
        body: |
          <p>Most residential projects include a site visit, measurements, concept layout, 3D renders for key rooms and a bill of materials so you can approve budget before production.</p>
    benefits:
      - One team for layout, 3D and modular coordination
      - Designs tailored to Delhi NCR apartment sizes and building rules
      - Clear milestones from concept to handover
    process:
      - { step: Site visit, detail: Measurements, lifestyle discussion and budget alignment in Delhi NCR. }
      - { step: Layout & 3D, detail: 2D plans and 3D views for approval before procurement. }
      - { step: Execution support, detail: Vendor coordination and site checks through handover. }
    faqs:
      - question: Do you take full-home and partial-room projects?
        answer: Yes. We handle complete 3BHK/2BHK interiors as well as single-room upgrades such as a bedroom or living area.
      - question: Which areas do you visit on site?
        answer: Delhi, Gurgaon, Noida and the wider Delhi NCR region for measurements and execution coordination.
