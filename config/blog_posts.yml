  - slug: modular-kitchen-cost-gurgaon
    title: "Modular Kitchen Cost in Gurgaon — What to Budget in 2026"
    excerpt: "Planning a modular kitchen in Gurgaon? Here is a practical cost breakdown by size, materials and finishes."
    category: interior
    published_at: "2026-08-15"
    read_time: "5 min"
    body: |
      <p>Modular kitchen prices in Gurgaon depend on layout, materials and brand of hardware. Most homeowners budget between layout planning, cabinets, countertop, appliances and installation.</p>
      <h2>Typical budget ranges</h2>
      <ul>
        <li><strong>Compact L-shape (80–100 sq ft):</strong> ₹1.8L – ₹3.5L</li>
        <li><strong>Standard U-shape (120–150 sq ft):</strong> ₹3.5L – ₹6L</li>
        <li><strong>Premium parallel / island:</strong> ₹6L – ₹12L+</li>
      </ul>
      <h2>What affects the price?</h2>
      <p>Cabinet material (HDHMR, plywood, MDF), finish (laminate, acrylic, PU), hardware (Hettich, Hafele), quartz vs granite countertop, and chimney/hob choices all shift the final quote.</p>
      <h2>How Arqvexa helps</h2>
      <p>We start with a site visit, 2D layout and 3D visualization so you approve the design and budget before production begins. <a href="/interior-design/modular-kitchen">Modular kitchen design</a> or <a href="/contact">book a consultation</a>.</p>

  - slug: website-cost-delhi-ncr
    title: "Website Development Cost in Delhi NCR — A Clear Guide"
    excerpt: "How much does a business website cost in Delhi, Gurgaon or Noida? Compare types, timelines and what you actually pay for."
    category: tech
    published_at: "2026-08-10"
    read_time: "6 min"
    body: |
      <p>Website pricing in Delhi NCR varies widely — from template sites to custom Rails/React builds. Here is a honest guide for small businesses and startups.</p>
      <h2>Common website types</h2>
      <ul>
        <li><strong>Single-page / landing site:</strong> ₹15,000 – ₹35,000</li>
        <li><strong>Multi-page business website:</strong> ₹35,000 – ₹80,000</li>
        <li><strong>E-commerce store:</strong> ₹80,000 – ₹2.5L+</li>
        <li><strong>Custom web app / CRM:</strong> ₹1.5L+ depending on scope</li>
      </ul>
      <h2>What is included?</h2>
      <p>A professional quote should cover design, mobile responsiveness, contact forms, basic SEO, hosting guidance and handover training. Ask about maintenance and content updates upfront.</p>
      <h2>Timeline</h2>
      <p>Most business websites take 2–4 weeks after content and design approval. E-commerce and custom software need a discovery call for an accurate timeline.</p>
      <p><a href="/it-development/web-development">Explore web development</a> or <a href="/contact">request a quote</a>.</p>

  - slug: 3bhk-interior-design-delhi-ncr
    title: "3BHK Interior Design in Delhi NCR — Process & Timeline"
    excerpt: "From site visit to handover — how a full-home interior project works in Delhi, Gurgaon and Noida."
    category: interior
    published_at: "2026-08-05"
    read_time: "5 min"
    body: |
      <p>A 3BHK interior project in Delhi NCR typically spans 8–14 weeks depending on scope, civil work and material lead times. Here is the process we follow at Arqvexa.</p>
      <h2>Step 1 — Discover</h2>
      <p>Site visit, measurements, lifestyle discussion and budget alignment. We note ventilation, storage needs and family habits.</p>
      <h2>Step 2 — Design</h2>
      <p>2D layouts, 3D renders and material boards for living, bedrooms, kitchen and bathrooms. Revisions until you sign off.</p>
      <h2>Step 3 — Build</h2>
      <p>Modular production, on-site work and vendor coordination. Regular updates with photos and milestone checks.</p>
      <h2>Step 4 — Deliver</h2>
      <p>Final styling, snag list closure and handover walkthrough. We stay available for post-handover support.</p>
      <p><a href="/interior-design/residential-interior-design">Residential interior design</a> or <a href="/contact">book a consultation</a>.</p>

  - slug: modular-kitchen-cost-noida
    title: "Modular Kitchen Cost in Noida — Budget Guide"
    excerpt: "Planning a modular kitchen in Noida? Typical price ranges by layout, materials and apartment size."
    category: interior
    published_at: "2026-08-20"
    read_time: "5 min"
    body: |
      <p>Modular kitchen costs in Noida follow similar drivers to Gurgaon and Delhi — layout size, shutter finish, hardware brand and countertop material.</p>
      <h2>Typical ranges for Noida apartments</h2>
      <ul>
        <li><strong>Compact kitchen (70–90 sq ft):</strong> ₹1.5L – ₹3L</li>
        <li><strong>Standard family kitchen:</strong> ₹3L – ₹5.5L</li>
        <li><strong>Premium finishes with tall units:</strong> ₹5.5L – ₹10L+</li>
      </ul>
      <h2>Local considerations</h2>
      <p>High-rise apartments in Noida often need careful planning for chimney ducting, gas line positions and service shaft access — we confirm these on the first site visit.</p>
      <p><a href="/interior-design/modular-kitchen">Modular kitchen design at Arqvexa</a> · <a href="/blog/modular-kitchen-cost-gurgaon">Gurgaon cost guide</a></p>

  - slug: mobile-app-development-cost-india
    title: "Mobile App Development Cost in India — What to Expect"
    excerpt: "A practical overview of mobile app budgets in India — MVP scope, platforms, integrations and timelines."
    category: tech
    published_at: "2026-08-18"
    read_time: "6 min"
    body: |
      <p>Mobile app pricing depends less on "Android or iOS" alone and more on screens, roles, integrations and admin needs.</p>
      <h2>Common app scopes</h2>
      <ul>
        <li><strong>Simple MVP (login + 3–5 core screens):</strong> often ₹1.5L – ₹3L</li>
        <li><strong>Booking / marketplace flow with admin:</strong> ₹3L – ₹8L+</li>
        <li><strong>Enterprise integrations (CRM, payments, maps):</strong> scoped after discovery</li>
      </ul>
      <h2>What affects timeline?</h2>
      <p>Design approval speed, third-party APIs, app-store compliance and whether you need a web admin panel alongside the app.</p>
      <p><a href="/it-development/mobile-app-development">Mobile app development</a> · <a href="/contact">Discuss your app idea</a></p>
