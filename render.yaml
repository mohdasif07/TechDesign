# Free deployment on Render.com
# Docs: https://render.com/docs/deploy-rails-docker
services:
  - type: web
    name: as-designtech
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      # Paste your key from config/master.key in the Render dashboard after first deploy setup
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: mohdasif.dev01@gmail.com
      - key: MAILER_FROM
        value: "AS DesignTech <mohdasif.dev01@gmail.com>"
      # Add these in Render dashboard when Gmail App Password is ready:
      # SMTP_ADDRESS=smtp.gmail.com  SMTP_PORT=587
      # SMTP_USERNAME=mohdasif.dev01@gmail.com  SMTP_PASSWORD=<app password>
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
