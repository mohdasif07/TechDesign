# Free deployment on Render.com
# Docs: https://render.com/docs/deploy-rails-docker
services:
  - type: web
    name: as-designtech
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      # Paste your key from config/master.key in the Render dashboard after first deploy setup
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: mohdasif.dev01@gmail.com
      - key: MAILER_FROM
        value: "AS DesignTech <mohdasif.dev01@gmail.com>"
      # Recommended (free, works on Render): https://web3forms.com — use your Gmail to get access key
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      # Optional Gmail SMTP (often blocked on Render — Web3Forms is easier):
      - key: SMTP_ADDRESS
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
