<!doctype html>
<html lang="en">
  <head>
    <title>Page not found | Arqvexa</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b1930">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f4ee;
        color: #0b1930;
        text-align: center;
        line-height: 1.5;
      }
      main { max-width: 28rem; display: grid; gap: 1.25rem; }
      .brand { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
      h1 { font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -0.04em; line-height: 1.1; }
      p { color: #4a5568; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 0.5rem; }
      a {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-primary { background: #0b1930; color: #fff; }
      .btn-outline { border: 1px solid #0b1930; color: #0b1930; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Arqvexa</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or may have moved.</p>
      <div class="actions">
        <a class="btn-primary" href="/">Back to homepage</a>
        <a class="btn-outline" href="/#contact">Contact us</a>
      </div>
    </main>
  </body>
</html>
