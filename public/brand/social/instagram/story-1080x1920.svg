<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arqvexa Instagram story">
  <defs>
    <linearGradient id="igs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#080B1A"/>
      <stop offset="100%" stop-color="#0C1638"/>
    </linearGradient>
    <linearGradient id="igs-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
