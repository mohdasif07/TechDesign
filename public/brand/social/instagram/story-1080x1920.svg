  <text x="540" y="1580" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="18" font-weight="500" fill="#6B7289" letter-spacing="0.2em">arqvexa.in</text>
