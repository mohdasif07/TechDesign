    </g>
    <circle cx="250" cy="60" r="16" fill="url(#igs-accent)"/>
    <circle cx="250" cy="230" r="11" fill="#00D9FF"/>
    <circle cx="115" cy="230" r="9" fill="#00D9FF"/>
    <circle cx="385" cy="230" r="9" fill="#7C3AED"/>
  </g>
  <text x="540" y="1180" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="72" font-weight="700" fill="#F7F7F2" letter-spacing="0.16em">ARQVEXA</text>
  <text x="540" y="1260" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
