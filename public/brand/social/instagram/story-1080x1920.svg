  </defs>
  <rect width="1080" height="1920" fill="url(#igs-bg)"/>
  <!-- Safe zone: keep content away from top/bottom UI (approx 250px) -->
  <g transform="translate(290 620)">
    <g fill="none" stroke="#F7F7F2" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M50 380 L250 60 L450 380"/>
      <path d="M115 230 H385"/>
