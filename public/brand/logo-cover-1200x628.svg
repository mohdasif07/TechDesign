    <circle cx="140" cy="40" r="11" fill="url(#og-accent)"/>
    <circle cx="140" cy="140" r="7" fill="#00D9FF"/>
    <circle cx="78" cy="140" r="6" fill="#00D9FF"/>
    <circle cx="202" cy="140" r="6" fill="#7C3AED"/>
